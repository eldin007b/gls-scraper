name: Pokreni GLS scraper

on:
  workflow_dispatch:         # manualno (ručno dugme ili API)
  schedule:
    - cron: '0 4 * * *'      # svaki dan u 06:00 po našem vremenu (4:00 UTC)

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Playwright browser
        run: npx playwright install --with-deps

      - name: Postavi ENV
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "GLS_USER=${{ secrets.GLS_USER }}" >> .env
          echo "GLS_PASS=${{ secrets.GLS_PASS }}" >> .env

      - name: Pokreni scraper
        run: node scraper.js
